<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静夜思 | 李白</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: #202326;
      color: #fff;
      font-family: Georgia, "Noto Serif CJK SC", "Songti SC", serif;
    }

    .poem-card {
      width: min(100%, 420px);
      padding: 40px 32px;
      border: 1px solid #021225;
      border-radius: 16px;
      background: #97b7d7;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.38);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 500;
    }

    .author {
      margin: 10px 0 24px;
      color: #d3d5d7;
      font-size: 15px;
    }

    .poem {
      margin: 0;
      font-size: 20px;
      line-height: 2;
    }
  </style>
</head>
<body>
  <main class="poem-card">
    <h1>静夜思</h1>
    <p class="author">唐 · 李白</p>
    <p class="poem">
                床前明月光，<br>
                疑是地上霜。<br>
                举头望明月，<br>
                低头思故乡。
            </p> <!-- 古诗盒子在这里盖上了！ -->

            <!-- 这是一个圆角图片 -->
            <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=500" style="border-radius: 20px; width: 300px; margin-top: 20px;">
            <br><br>
            
            <!-- 这是一个赛博朋克按钮 -->
            <button style="background-color: #06f2de; color: rgb(202, 215, 228); padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold;">
                点击我！
            </button>
  </main>
</body>
</html>
